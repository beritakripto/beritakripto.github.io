<!doctype html><html lang="id-ID"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><title>Cari Berita</title><link rel="stylesheet" href="/assets/site.css"></head><body><header class="top"><div class="container nav"><a class="brand" href="/">CRYPTO<span>NEWS</span></a><nav class="links"><a href="/">Beranda</a><a href="/category/crypto/">Crypto</a><a href="/category/bitcoin/">Bitcoin</a><a href="/category/defi/">DeFi</a><a href="/search/">Cari</a></nav></div></header><main class="container" style="padding:45px 0 80px"><h1>Cari Berita</h1><input id="q" style="width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:9px" placeholder="Cari berita..."><div id="r" class="grid" style="margin-top:20px"></div></main><script>const P=[{"title":"Contoh Berita Kripto","slug":"contoh-berita-kripto","excerpt":"Artikel contoh untuk menguji CMS berita.","category":"Crypto","image":"/images/default-news.svg","imageAlt":"CryptoNews","date":"13 Agu 2026"}];const E=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function run(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('r').innerHTML=P.filter(p=>(p.title+' '+p.excerpt+' '+p.category).toLowerCase().includes(q)).map(p=>'<a class="card" href="/'+p.slug+'/"><img src="'+E(p.image||'/images/default-news.svg')+'" alt="'+E(p.imageAlt||p.title)+'"><div class="body"><div class="meta">'+E(p.category)+' · '+E(p.date)+'</div><h3>'+E(p.title)+'</h3><p>'+E(p.excerpt)+'</p></div></a>').join('')}document.getElementById('q').oninput=run;run();</script><footer class="footer"><div class="container">CryptoNews — Portal berita kripto, blockchain, DeFi, Bitcoin dan Web3.</div></footer></body></html>
